@if (isOpen()) {
  <div class="modal-overlay" (click)="onClose()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ title() }}</h3>
        <button class="close-btn" (click)="onClose()">×</button>
      </div>
      <div class="modal-body">
        <ng-content />
      </div>
    </div>
  </div>
}
